services:
  php-apache:
    ports:
      - "80:80"
    build: './docker/php'
    volumes:
      - ./src:/var/www/html
  mysql:
    ports:
      - "3306:3306"
    build: './docker/mysql'
    environment:
      MYSQL_ROOT_PASSWORD: "root"
      MYSQL_DATABASE: "database"
    volumes:
      - dbData:/var/lib/mysql
  phpmyadmin:
    image: phpmyadmin
    restart: always
    ports:
      - 8090:80
    environment:
      - PMA_ARBITRARY=1
volumes:
  app:
  dbData: